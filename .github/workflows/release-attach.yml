name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach protected zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Dayline-v19-protected.zip "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1790137410963-Dayline-v19-protected-ebxvamXqItQvHlfx3TnUC1FtK8vRyM.zip"
          ls -la Dayline-v19-protected.zip
          sha256sum Dayline-v19-protected.zip
          gh release upload v19 Dayline-v19-protected.zip --repo shtefcs/dayline --clobber
