name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Dayline-v18.exe "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1790124216069-Dayline-v18-zlahRjOknRjHbqV6lrcMJ1Owm6qXKd.exe"
          ls -la Dayline-v18.exe
          sha256sum Dayline-v18.exe
          zip -q Dayline-v18.zip Dayline-v18.exe
          gh release upload v18 Dayline-v18.zip Dayline-v18.exe --repo shtefcs/dayline --clobber
