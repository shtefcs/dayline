name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Dayline-v20.exe "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1790584547492-Dayline-v20-DmOOSHgfFbrSh0N2IJWH3mJvKENP5s.exe"
          ls -la Dayline-v20.exe
          sha256sum Dayline-v20.exe
          zip -q Dayline-v20.zip Dayline-v20.exe
          gh release upload v20 Dayline-v20.zip Dayline-v20.exe --repo shtefcs/dayline --clobber
