name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Dayline-v16.exe "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1789959195777-Dayline-v16-6TdIiOOT9cM8HQXtwNXH5rA23fEPPp.exe"
          ls -la Dayline-v16.exe
          sha256sum Dayline-v16.exe
          zip -q Dayline-v16.zip Dayline-v16.exe
          gh release upload v16 Dayline-v16.zip Dayline-v16.exe --repo shtefcs/dayline --clobber
