name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Dayline-v17.exe "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1789960812080-Dayline-v17-Lmj2OTbWhCnEhTrJzj1jMtVScZetOF.exe"
          ls -la Dayline-v17.exe
          sha256sum Dayline-v17.exe
          zip -q Dayline-v17.zip Dayline-v17.exe
          gh release upload v17 Dayline-v17.zip Dayline-v17.exe --repo shtefcs/dayline --clobber
