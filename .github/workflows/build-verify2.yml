name: build-verify2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build + bisect
        shell: bash
        run: |
          curl -sL "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1789425452404-dayline-build19-ncZ6DEFAK4rq95viDdjrSO43ZLD8JP.sh" -o build.sh
          echo "8c8c4fcfe0eb0ec15afe043681e89551  build.sh" | md5sum -c -
          bash build.sh || true
      - name: rebuild full app + release
        shell: bash
        run: |
          cd dayline-src
          cp src/variants/v0_full.native src/app.native
          native build . --yes
          cd ..
          mkdir -p rel
          cp dayline-src/zig-out/bin/dayline.exe rel/Dayline.exe
          cp dayline-src/zig-out/bin/dayline_services.exe rel/ 2>/dev/null || true
          powershell -Command "Compress-Archive -Path rel/* -DestinationPath Dayline-Windows-NativeSDK.zip -Force"
          ls -la Dayline-Windows-NativeSDK.zip
          gh release create v0.2.0 Dayline-Windows-NativeSDK.zip --repo shtefcs/dayline --title "Dayline v0.2.0" --notes "Native SDK build for Windows. Unzip and run Dayline.exe." || gh release upload v0.2.0 Dayline-Windows-NativeSDK.zip --repo shtefcs/dayline --clobber
