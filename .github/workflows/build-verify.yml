# Native SDK build + render verification on a real Windows runner
name: Build and Verify Windows (Native SDK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Restore project from bundle
        shell: bash
        run: |
          curl -s -X POST https://temp.sh/KkhZT/final2.bundle.gz -o b.gz
          gzip -dc b.gz > repo.bundle
          git clone repo.bundle dayline-src
          ls dayline-src

      - name: Install Native SDK CLI
        shell: bash
        run: npm install -g @native-sdk/cli@0.10.1

      - name: Download Zig 0.16.0 (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath .
          echo "$PWD\\zig-x86_64-windows-0.16.0" >> $env:GITHUB_PATH

      - name: Patch SDK build graph (COFF multi-object workaround)
        shell: bash
        working-directory: dayline-src
        run: |
          P=(npm prefix -g)/node_modules/@native-sdk/cli/build/app.zig
          ls -la "$P" || find "$(npm prefix -g)/node_modules/@native-sdk/cli" -name "app.zig"
          python3 patch_sdk.py "$P" || python3 patch_sdk.py

      - name: Build (ReleaseFast, automation enabled)
        shell: bash
        working-directory: dayline-src
        run: |
          native build . --yes -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast -Dautomation=true
          find zig-out -type f | head -20

      - name: Run app + verify UI renders (not blank)
        shell: bash
        working-directory: dayline-src
        run: |
          EXE=$(find zig-out -name "*.exe" ! -name "*services*" | head -1)
          echo "main exe: $EXE"
          ./"$EXE" &
          sleep 8
          native automate wait || true
          native automate list || true
          native automate assert 'gpu_nonblank=true' && echo "UI_RENDERED=OK" || echo "UI_RENDERED=BLANK"
          native automate screenshot main-canvas || true
          ls -la *.png .zig-cache/native-sdk-automation/ 2>/dev/null | head
        timeout-minutes: 5

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshot
          path: |
            dayline-src/*.png
            dayline-src/.zig-cache/native-sdk-automation/*
          if-no-files-found: warn

      - name: Package + release
        shell: bash
        working-directory: dayline-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          find zig-out -type f \( -name "*.exe" -o -name "*.dll" \) -exec cp {} dist/ \;
          cp *.png dist/ 2>/dev/null || true
          ls -la dist
          gh release delete v0.2.0 --yes || true
          gh release create v0.2.0 dist/* --title "Dayline v0.2.0 (Native SDK, verified)" --notes "Windows build with rendering verification (gpu_nonblank assert + screenshot)."
