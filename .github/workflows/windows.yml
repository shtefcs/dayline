name: Build Dayline (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath C:\zig
          $dir = (Get-ChildItem "C:\zig" -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_PATH $dir

      - name: Install llvm-mingw (GNU clang)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llmv-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip" -OutFile llvm.zip
          Expand-Archive -Path llvm.zip -DestinationPath C:\llvm
          Add-Content $env:GITHUB_PATH "C:\llvm\llvm-mingw-20260908-ucrt-x86_64\bin"

      - name: Install Native SDK CLI
        run: npm install -g @native-sdk/cli

      - name: Restore project from bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ue3kcebnzhso5m0y.public.blob.vercel-storage.com/generated/254e51ab-69e3-4b81-a7f6-6fafb2d561a5/1789348159428-repo-lFfuwHCbCh90g5GFevftWWPKkzvJsa.bundle" -OutFile repo.bundle
          git clone repo.bundle restored

      - name: Install deps
        run: npm install
        working-directory: restored

      - name: Build
        run: npx native build
        working-directory: restored

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: dayline-windows
          path: restored/**/*.exe
